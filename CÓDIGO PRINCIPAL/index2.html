<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Animais - Perguntas</title>
    <link rel="stylesheet" href="style-2.css">
</head>
<body>
    <header class="Cabecalho">
        <h1>5 PERGUNTAS SOBRE RÉPTEIS</h1>
    </header>

    <main>
        <section class="perguntas">
            <!-- pergunta 1 -->
            <section class="pergunta1">
                <h2>1 - Qual característica é comum a todos os répteis?</h2>
                <form>
                    <input type="radio" value="Pele úmida" id="p1a" class="pergunta1">
                    <label for="pergunta1">Pele úmida</label> <br>

                    <input type="radio" value="Corpo coberto por escamas" id="p1b" class="pergunta1">
                    <label for="pergunta1">Corpo coberto por escamas</label> <br>

                    <input type="radio" value="Respiração por brânquias" id="p1c" class="pergunta1">
                    <label for="pergunta1">Respiração por brânquias</label> <br>

                    <input type="radio" value="angue frio apenas na fase jovem" id="p1d" class="pergunta1">
                    <label for="pergunta1">angue frio apenas na fase jovem</label> <br>
                </form>
            </section>

            <!-- pergunta 2 -->
            <section class="pergunta2">
                <h2>2 - Qual destes animais é um réptil?</h2>

                <form>
                    <input type="radio" value="Sapo" id="p2a" class="pergunta2">
                    <label for="p2a">Sapo</label> <br>

                    <input type="radio" value="Salamandra" id="p2b" class="pergunta2">
                    <label for="p2b">Salamandra</label> <br>

                    <input type="radio" value="Tartaruga" id="p2c" class="pergunta2">
                    <label for="p2c">Tartaruga</label> <br>

                    <input type="radio" value="Lontra" id="p2d" class="pergunta2">
                    <label for="p2d">Lontra</label> <br>
                </form>



            </section>

            <!-- pergunta 3  -->
             <section class="pergunta3">
                <h2>3 - Os répteis são classificados como:</h2>
                <form>
                    <input type="radio" value="Animais invertebrados" class="pergunta3" id="p3a">
                    <label for="p3a">Animais invertebrados</label> <br>
                    
                    <input type="radio"  value="Mamíferos de sangue frio" class="pergunta3" id="p3b">
                    <label for="p3b">Mamíferos de sangue frio</label> <br>
                    
                    <input type="radio"  value="Vertebrados" class="pergunta3" id="p3c">
                    <label for="p3c">Vertebrados</label> <br>
                    
                    <input type="radio" value="Anfíbios terrestres" class="pergunta3" id="p3d">
                    <label for="p3d">Anfíbios terrestres</label> <br>
                </form>


             </section>

             <!-- pergunta 4 -->
             <section class="pergunta4">
                <h2>4 - Como a maioria dos répteis se reproduz?</h2>
                <form>
                    <input type="radio" value="Ovíparos (botam ovos)" class="pergunta4" id="p4a">
                    <label for="p4a">Ovíparos (botam ovos)</label> <br>
                    
                    <input type="radio" value="Vivíparos (nascem da barriga da mãe)" class="pergunta4" id="p4b">
                    <label for="p4b">Vivíparos (nascem da barriga da mãe)</label> <br>

                    <input type="radio" value="Brotamento" class="pergunta4" id="p4c">
                    <label for="p4c">Brotamento</label> <br>

                    <input type="radio" value="Metamorfose" class="pergunta4" id="p4d">
                    <label for="p4d">Metamorfose</label> <br>
                </form>



             </section>

             <!-- pergunta 5 -->
             <section class="pergunta5">
                <h2>5 - Qual é o nome do processo em que as cobras trocam de pele?</h2>
                <form>
                    <input type="radio" value="Hibernação" class="pergunta5" id="p5a">
                    <label for="p5a">Hibernação</label> <br>

                    <input type="radio" value="Muda" class="pergunta5" id="p5b">
                    <label for="p5b">Muda</label> <br>

                    <input type="radio" value="Camuflagem" class="pergunta5" id="p5c">
                    <label for="p5c">Camuflagem</label> <br>

                    <input type="radio" value="Metamorfose" class="pergunta5" id="p5d">
                    <label for="p5d">Metamorfose</label> <br>
                </form>

            <button>
                <a href="index3.html">RESPOSTAS</a>
            </button>

            <button>
            <a href="index.html">INÍCIO</a>
            </button>

             </section>



        </section>
    </main>
    
</body>
</html>
